name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CalendarioBento.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CalendarioBento-apk
          path: CalendarioBento.apk

      - name: Publish release with the APK (main only)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.${{ github.run_number }}
          name: Calendário Bento 0.2.${{ github.run_number }}
          body: Descarrega o ficheiro CalendarioBento.apk abaixo e abre-o no telemóvel para instalar.
          files: CalendarioBento.apk
          make_latest: true

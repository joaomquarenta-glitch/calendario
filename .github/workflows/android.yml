name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Check the signing key password is set (main only)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          FORTY_KEYSTORE_PASSWORD: ${{ secrets.FORTY_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$FORTY_KEYSTORE_PASSWORD" ]; then
            echo "::error::Missing secret FORTY_KEYSTORE_PASSWORD: without it the phone would refuse the update."
            exit 1
          fi

      - name: Build debug APK
        env:
          FORTY_KEYSTORE_PASSWORD: ${{ secrets.FORTY_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk FortyCalendar.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FortyCalendar-apk
          path: FortyCalendar.apk

      - name: Publish release with the APK (main only)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.${{ github.run_number }}
          name: FortyCalendar 0.3.${{ github.run_number }}
          body: Descarrega o ficheiro FortyCalendar.apk abaixo e abre-o no telemóvel para instalar.
          files: FortyCalendar.apk
          make_latest: true

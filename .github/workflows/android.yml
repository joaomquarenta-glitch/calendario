name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Builds on main run one at a time, in merge order, so the newest merge is always
# the release the app sees as "latest" (several quick merges used to finish out of order).
concurrency:
  group: ${{ github.event_name == 'push' && 'release-main' || format('pr-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests (rules and screens)
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Keep the test report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/testDebugUnitTest

      - name: Check the signing key password is set (main only)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          FORTY_KEYSTORE_PASSWORD: ${{ secrets.FORTY_KEYSTORE_PASSWORD }}
          FORTY_KEYSTORE_B64: ${{ secrets.FORTY_KEYSTORE_B64 }}
        run: |
          if [ -z "$FORTY_KEYSTORE_PASSWORD" ] || [ -z "$FORTY_KEYSTORE_B64" ]; then
            echo "::error::Missing secrets FORTY_KEYSTORE_B64 / FORTY_KEYSTORE_PASSWORD: without them the phone would refuse the update."
            exit 1
          fi

      - name: Restore the signing key from the secret
        env:
          FORTY_KEYSTORE_B64: ${{ secrets.FORTY_KEYSTORE_B64 }}
        run: |
          if [ -n "$FORTY_KEYSTORE_B64" ]; then
            mkdir -p keystore
            echo "$FORTY_KEYSTORE_B64" | base64 --decode > keystore/fortycalendar.p12
          fi

      - name: Build release APK
        env:
          FORTY_KEYSTORE_PASSWORD: ${{ secrets.FORTY_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk FortyCalendar.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FortyCalendar-apk
          path: FortyCalendar.apk

      - name: Publish release with the APK (main only)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.${{ github.run_number }}
          name: FortyCalendar 0.3.${{ github.run_number }}
          body: Descarrega o ficheiro FortyCalendar.apk abaixo e abre-o no telemóvel para instalar.
          files: FortyCalendar.apk
          make_latest: true
